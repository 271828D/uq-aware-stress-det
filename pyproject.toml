[project]
name = "uq-stress-det"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "hydra-core>=1.3.5",
    "hydra-optuna-sweeper>=1.2.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
    "wandb>=0.28.2",
    "xgboost>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.black]
line-length = 79
target-version = ["py312"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | \.uv
  | notebooks
  | data
)/
'''

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/notebooks/*", "*/data/*"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=1.2",
]

[tool.uv]
package = true  # Ensures the project is importable for mkdocstrings
