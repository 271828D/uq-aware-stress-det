repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # Closest stable tag to your v4.6.2 pre-commit installation
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/psf/black
    rev: 26.5.1  # Matches your uv venv
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0   # Matches your uv venv
    hooks:
      - id: flake8
        args: ['--max-line-length=79']