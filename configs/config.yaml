# @package _global_
defaults:
  - _self_
  - model: logistic_regression
  - data: stress_data
  - training: default
  - search_space: logistic_regression
  - override hydra/sweeper: optuna  # ✅ Add this line
  - override hydra/sweeper/sampler: tpe  # ✅ TPE is better than random search
  
  

project_name: uq-stress-det
seed: 42

# Optuna-specific settings
hydra:
  mode: MULTIRUN  # Required for Optuna
  sweep:
    dir: multirun/${model.model_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: seed_${seed}_${now:%Y-%m-%d_%H-%M-%S}
  sweeper:
    sampler:
      seed: ${seed}  # Reproducible trials
      n_startup_trials: 5  # Random trials before Bayesian optimization kicks in
      n_ei_candidates: 24  # Number of candidates for improvement
    direction: maximize  # We want to maximize F1-score
    study_name: ${model.model_name}_tuning
    storage: null  # Use in-memory (or sqlite:///optuna.db for persistence)
    n_trials: 20  # Total number of hyperparameter combinations to try
    n_jobs: 1  # Sequential trials (increase for parallel if you have multiple CPUs)
    

wandb:
  project: "stress-detection"
  run_name: ${model.model_name}_optuna
  entity: null   